apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-jenkins

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hello-jenkins

  template:
    metadata:
      labels:
        app: hello-jenkins

    spec:
      containers:
      - name: hello-jenkins
        image: uday9533/hello-jenkins:2
        imagePullPolicy: Always

        ports:
        - containerPort: 80
